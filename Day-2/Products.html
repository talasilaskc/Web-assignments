<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List</title>
  <link rel="stylesheet" href="Products.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <h1>Tech Store</h1>
    <p>Quality gadgets at best prices</p>
  </header>

  <!-- Main Content -->
  <main class="container">

    <section class="product-section">
      <h2>Our Products</h2>

      <div class="product-grid">

        <article class="product-card">
          <img src="./images/headphones.jpg" alt="Headphones">
          <h3>Wireless Headphones</h3>
          <p class="price">$59.99</p>
          <button>Add to Cart</button>
        </article>

        <article class="product-card">
          <img src="./images/smart watch.jpg" alt="Smart Watch">
          <h3>Smart Watch</h3>
          <p class="price">$129.99</p>
          <button>Add to Cart</button>
        </article>

        <article class="product-card">
          <img src="./images/speakers.jpg" alt="Speaker">
          <h3>Bluetooth Speaker</h3>
          <p class="price">$89.99</p>
          <button>Add to Cart</button>
        </article>

        <article class="product-card">
          <img src="./images/earbuds.jpg" alt="Earbuds">
          <h3>Noise Cancelling Earbuds</h3>
          <p class="price">$99.99</p>
          <button>Add to Cart</button>
        </article>

        <article class="product-card">
          <img src="./images/tablet.jpg" alt="Tablet">
          <h3>10-inch Tablet</h3>
          <p class="price">$199.99</p>
          <button>Add to Cart</button>
        </article>

        <article class="product-card">
          <img src="./images/laptop.jpg" alt="Laptop">
          <h3>Lightweight Laptop</h3>
          <p class="price">$799.99</p>
          <button>Add to Cart</button>
        </article>



      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2026 Tech Store. All rights reserved.</p>
  </footer>

</body>
</html>
